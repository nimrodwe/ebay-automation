name: eBay tests

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: allure-pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      EBAY_USER: ${{ secrets.EBAY_USER }}
      EBAY_PASS: ${{ secrets.EBAY_PASS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages and Chromium
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a pytest

      - name: Get old reports
        if: always()
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        if: always()
        env:
          RUN: ${{ github.run_number }}
        run: |
          mkdir -p gh-pages allure-results allure-history
          cp -r gh-pages/. allure-history/
          rm -rf allure-history/.git
          last=$(ls gh-pages | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -d "gh-pages/$last/history" ]; then cp -r "gh-pages/$last/history" allure-results/; fi
          npx --yes allure-commandline@2.46.1 generate allure-results -o "allure-history/$RUN" --clean
          ls allure-history | grep -E '^[0-9]+$' | sort -n | head -n -20 | xargs -r -I{} rm -rf "allure-history/{}"
          rm -rf allure-history/index.html allure-history/assets allure-history/data allure-history/widgets allure-history/history allure-history/export
          cp -r "allure-history/$RUN/." allure-history/

      - name: Publish Allure report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Allure report link
        if: always()
        run: |
          link="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/"
          echo "Allure report: $link"
          echo "### 📊 [Allure report for run #${{ github.run_number }}]($link)" >> "$GITHUB_STEP_SUMMARY"
