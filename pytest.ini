[pytest]
testpaths = tests
pythonpath = .
addopts = --alluredir=allure-results --clean-alluredir --reruns 1 --reruns-delay 20 --only-rerun RuntimeError --only-rerun TimeoutError

# Logging: live in the console + saved to logs/test.log
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_date_format = %H:%M:%S
log_file = logs/test.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
